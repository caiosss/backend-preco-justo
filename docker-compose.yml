name: preco-justo

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: preco_justo
      POSTGRES_PASSWORD: preco_justo
      POSTGRES_DB: preco_justo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preco_justo -d preco_justo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://preco_justo:preco_justo@db:5432/preco_justo
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

  # Somente homologação: expõe a API em uma URL HTTPS pública.
  #   docker compose --profile homolog up -d --build
  # A URL aparece em http://localhost:4040 (painel do ngrok).
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["homolog"]
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'if [ -n "$$NGROK_DOMAIN" ]; then exec ngrok http api:3333 --url="$$NGROK_DOMAIN" --log=stdout; else exec ngrok http api:3333 --log=stdout; fi'
    ports:
      - "4040:4040"
    depends_on:
      - api

volumes:
  pgdata:
